# The same gate the author runs locally, run again where forgetting is not possible.
#
# Runs exactly what the author runs locally: `npm test` and `npm run check:code`, the two halves of
# the definition of done. The moment CI and local diverge, a green local run stops meaning anything.
#
# They stay separate commands rather than one, because "tests pass" and "the rules the tests depend
# on are still enforced" are different claims and each should be answerable on its own.
#
#   test        vitest --run — the whole suite, every *.test.ts under src/
#   check:code  lint (incl. the src/core/ purity rule) · types · expo-doctor (soft-fails offline)
#
# Ubuntu, not macOS. No device builds here — macOS runners cost roughly ten times the minutes, and
# everything worth gating (lint including the core/ purity rule, types, tests) is platform-agnostic
# by construction. Device builds go through EAS on demand.
#
# Third-party actions are pinned to a commit SHA rather than a tag. A tag is mutable; a compromised
# or retagged action would otherwise run with repository credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      # expo-doctor inside this degrades to a warning, so a flaky registry cannot fail the build for
      # a reason unrelated to the change.
      - run: npm run check:code

      # Advisory, never gating — it reports conventions and how many decisions remain uncovered.
      - run: npm run check:rules
